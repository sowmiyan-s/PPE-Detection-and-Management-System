  <text x="110" y="330" text-anchor="middle" font-size="10" fill="#94a3b8">Files + YouTube Live</text>
  <rect x="32" y="390" width="156" height="80" rx="8" fill="#0e3040" stroke="#22d3ee" stroke-width="1.5" filter="url(#glow)"/>
