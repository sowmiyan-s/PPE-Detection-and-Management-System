  <text x="110" y="112" text-anchor="middle" font-size="11" fill="#00b4d8" font-weight="bold">INPUT LAYER</text>
  <rect x="32" y="125" width="156" height="65" rx="8" fill="#0e2a3d" stroke="#00b4d8" stroke-width="1.2"/>
  <text x="110" y="152" text-anchor="middle" font-size="11" fill="#00b4d8" font-weight="bold">USB Webcam</text>
  <text x="110" y="170" text-anchor="middle" font-size="10" fill="#94a3b8">Local video device</text>
