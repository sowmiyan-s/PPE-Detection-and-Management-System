<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="camera-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <radialGradient id="lens-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="70%" stop-color="#0284C7" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0369A1" stop-opacity="0.2"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="100" height="100" rx="22" fill="url(#bg-grad)" stroke="#334155" stroke-width="2"/>

  <!-- CCTV Camera Body Group -->
  <g filter="url(#shadow)">
    <!-- Mount Base & Stand -->
    <path d="M 22 28 L 36 28 L 36 42 Z" fill="#475569"/>
    <rect x="18" y="24" width="8" height="16" rx="2" fill="#64748B"/>
    
    <!-- Camera Main Body (Bullet CCTV Housing) -->
    <path d="M 32 30 L 72 30 C 77 30 80 34 80 39 L 80 57 C 80 62 77 66 72 66 L 32 66 C 28 66 25 62 25 57 L 25 39 C 25 34 28 30 32 30 Z" fill="#F8FAFC"/>
    
    <!-- Sun Shield Hood -->
    <path d="M 28 26 L 78 26 L 74 31 L 32 31 Z" fill="#CBD5E1"/>

    <!-- Dark Front Faceplate -->
    <ellipse cx="73" cy="48" rx="5" ry="14" fill="#0F172A"/>

    <!-- Outer Camera Lens Ring -->
    <circle cx="56" cy="48" r="11" fill="#1E293B" stroke="#475569" stroke-width="2"/>
    
    <!-- Glowing Camera Lens -->
    <circle cx="56" cy="48" r="7" fill="url(#lens-glow)"/>
    <circle cx="58" cy="46" r="2.5" fill="#FFFFFF" opacity="0.7"/>

    <!-- Red Recording LED Dot -->
    <circle cx="34" cy="37" r="3.5" fill="#EF4444"/>
    <circle cx="34" cy="37" r="2" fill="#FCA5A5"/>

    <!-- IR LED Ring Accents -->
    <circle cx="50" cy="42" r="1.5" fill="#38BDF8" opacity="0.8"/>
    <circle cx="62" cy="42" r="1.5" fill="#38BDF8" opacity="0.8"/>
    <circle cx="50" cy="54" r="1.5" fill="#38BDF8" opacity="0.8"/>
    <circle cx="62" cy="54" r="1.5" fill="#38BDF8" opacity="0.8"/>
  </g>

  <!-- Sub-text / Line Indicator -->
  <line x1="25" y1="78" x2="75" y2="78" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
</svg>
